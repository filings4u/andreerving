<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — Andre Erving</title><link rel="stylesheet" href="assets/css/style.css"><style>body{background:#f6f8fb}.dash{padding:48px 0}.account-head{display:flex;justify-content:space-between;gap:18px;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tabs button{padding:10px 14px;border:1px solid #ccd5df;background:#fff;border-radius:999px}.tabs button.active{background:#0b1f3a;color:#fff}.panel{background:#fff;border:1px solid #dde4ec;border-radius:18px;padding:24px;margin-bottom:22px}.course-grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.course-card2{border:1px solid #e1e7ed;border-radius:16px;overflow:hidden;background:#fff}.course-card2 img{width:100%;height:180px;object-fit:cover}.course-card2 .body{padding:17px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #edf0f3;text-align:left}@media(max-width:900px){.course-grid2{grid-template-columns:1fr}.account-head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="site-header"><div class="top-strip"><div class="container"><span>Customer Portal</span><a href="index.html">Back to website →</a></div></div><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-copy"><strong>ANDRE ERVING</strong><span>Customer Account</span></span></a><div class="nav-actions"><button class="btn btn-ghost" id="signOut">Sign Out</button></div></div></header><main class="dash"><div class="container"><div class="account-head"><div><span class="eyebrow">My Account</span><h1 id="hello">Welcome back.</h1><p>Access your orders, documents, and courses from one place.</p></div></div><div class="tabs"><button class="active" data-tab="mycourses">My Courses</button><button data-tab="orders">Orders</button><button data-tab="documents">Documents</button><button data-tab="available">Available Courses</button></div><section id="mycourses" class="tab panel"><h2>Your courses</h2><div id="ownedCourses" class="course-grid2"></div></section><section id="orders" class="tab panel" hidden><h2>Orders</h2><table class="table"><thead><tr><th>Order</th><th>Status</th><th>Total</th><th>Date</th></tr></thead><tbody id="orderRows"></tbody></table></section><section id="documents" class="tab panel" hidden><h2>Documents</h2><div id="docRows"></div></section><section id="available" class="tab panel" hidden><h2>Available courses</h2><p>If you have not purchased a course yet, choose one below.</p><div id="availableCourses" class="course-grid2"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/portal-common.js"></script><script>
const c=AE();let session;const card=(x,owned)=>`<article class="course-card2"><img src="${AEPortal.escape(x.featured_image_url||'assets/images/courses-classroom.webp')}" alt=""><div class="body"><span class="eyebrow">${AEPortal.escape(x.category||'Course')}</span><h3>${AEPortal.escape(x.title)}</h3><p>${AEPortal.escape(x.short_description||'')}</p>${owned?`<a class="btn btn-primary" href="course-player.html?course=${encodeURIComponent(x.slug)}">Continue Course</a>`:`<div class="price">${AEPortal.money(x.price)}</div><a class="btn btn-primary" href="${AEPortal.escape(x.purchase_url||('#'))}">Purchase Course</a>`}</div></article>`;
async function boot(){session=await AEPortal.requireAuth(c);const uid=session.user.id;const {data:p}=await c.from('customer_profiles').select('*').eq('id',uid).maybeSingle();hello.textContent=`Welcome${p?.full_name?' '+p.full_name.split(' ')[0]:''}.`;const [{data:en},{data:all},{data:orders},{data:docs}]=await Promise.all([c.from('course_enrollments').select('course_id,status,courses(*)').eq('user_id',uid).eq('status','active'),c.from('courses').select('*').eq('status','published').order('sort_order'),c.from('orders').select('*').eq('user_id',uid).order('created_at',{ascending:false}),c.from('customer_documents').select('*').eq('user_id',uid).order('created_at',{ascending:false})]);const owned=(en||[]).map(e=>e.courses).filter(Boolean);ownedCourses.innerHTML=owned.length?owned.map(x=>card(x,true)).join(''):'<p>You do not have an active course yet. Open <strong>Available Courses</strong> to browse programs.</p>';const ids=new Set(owned.map(x=>x.id));availableCourses.innerHTML=(all||[]).filter(x=>!ids.has(x.id)).map(x=>card(x,false)).join('')||'<p>No additional courses are available right now.</p>';orderRows.innerHTML=(orders||[]).map(o=>`<tr><td>${AEPortal.escape(o.order_number)}</td><td>${o.status}</td><td>${AEPortal.money(o.total)}</td><td>${new Date(o.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="4">No orders yet.</td></tr>';docRows.innerHTML=(docs||[]).map(d=>`<p><strong>${AEPortal.escape(d.title)}</strong> — ${AEPortal.escape(d.description||'')} <a href="${AEPortal.escape(d.file_url)}" target="_blank">View document →</a></p>`).join('')||'<p>No documents have been added to your account.</p>';}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.hidden=true);document.getElementById(b.dataset.tab).hidden=false;});signOut.onclick=async()=>{await c.auth.signOut();location.href='customer-login.html'};boot();
</script></body></html>
