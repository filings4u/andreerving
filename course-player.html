<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course — Andre Erving</title><link rel="stylesheet" href="assets/css/style.css"><style>body{background:#f4f6f9}.player{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.course-side{background:#0b1f3a;color:#fff;padding:25px;overflow:auto}.course-side a{color:#fff}.module-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9fb5d0;margin:20px 0 8px}.lesson-btn{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce7f3;padding:10px;border-radius:8px;cursor:pointer}.lesson-btn.active,.lesson-btn:hover{background:#18375f}.lesson-btn.done:before{content:'✓ ';color:#f2c35b}.content{padding:38px}.lesson-card{max-width:920px;background:#fff;border:1px solid #dde4ec;border-radius:20px;padding:32px}.video-wrap iframe,.video-wrap video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.progress{height:8px;background:#233f64;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#e3b64d}@media(max-width:900px){.player{grid-template-columns:1fr}.course-side{position:relative}.content{padding:18px}}</style><meta name="robots" content="noindex,nofollow"><meta name="description" content="Private learning classroom for enrolled Andre Erving students."></head><body><div class="player"><aside class="course-side"><a href="https://app.andreerving.com/">← My Account</a><h2 id="courseName">Course</h2><div class="progress"><span id="progressBar" style="width:0%"></span></div><div id="progressText" class="small">0% complete</div><div id="lessonNav"></div></aside><main class="content"><section class="lesson-card"><span class="eyebrow" id="lessonType">Lesson</span><h1 id="lessonTitle">Select a lesson</h1><div id="lessonContent"></div><div class="bottom-nav"><button class="btn btn-ghost" id="prevBtn">Previous</button><button class="btn btn-primary" id="completeBtn">Mark Complete & Continue</button></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/portal-common.js"></script><script>
const c=AE();let session,course,mods=[],lessons=[],progress=new Set(),idx=0;async function boot(){session=await AEPortal.requireAuth(c);const slug=new URLSearchParams(location.search).get('course');if(!slug){location.href='https://app.andreerving.com/';return;}const {data:co}=await c.from('courses').select('*').eq('slug',slug).single();if(!co){location.href='https://app.andreerving.com/';return;}course=co;const {data:en}=await c.from('course_enrollments').select('id').eq('user_id',session.user.id).eq('course_id',course.id).eq('status','active').maybeSingle();if(!en){location.href='https://app.andreerving.com/';return;}const [{data:m},{data:l},{data:p}]=await Promise.all([c.from('course_modules').select('*').eq('course_id',course.id).order('sort_order'),c.from('course_lessons').select('*').eq('course_id',course.id).order('sort_order'),c.from('lesson_progress').select('lesson_id,completed').eq('user_id',session.user.id).eq('course_id',course.id)]);mods=m||[];lessons=l||[];(p||[]).filter(x=>x.completed).forEach(x=>progress.add(x.lesson_id));courseName.textContent=course.title;renderNav();show(0);updateProgress();}
function renderNav(){lessonNav.innerHTML=mods.map(m=>`<div><div class="module-title">${AEPortal.escape(m.title)}</div>${lessons.filter(l=>l.module_id===m.id).map(l=>`<button class="lesson-btn ${progress.has(l.id)?'done':''}" data-id="${l.id}">${AEPortal.escape(l.title)}</button>`).join('')}</div>`).join('');document.querySelectorAll('.lesson-btn').forEach(b=>b.onclick=()=>show(lessons.findIndex(l=>l.id===b.dataset.id)));}
function show(i){if(!lessons.length){lessonTitle.textContent='Course content is being prepared.';lessonContent.innerHTML='<p>Check back soon for lessons.</p>';completeBtn.hidden=true;prevBtn.hidden=true;return;}idx=Math.max(0,Math.min(i,lessons.length-1));const l=lessons[idx];document.querySelectorAll('.lesson-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===l.id));lessonType.textContent=l.lesson_type;lessonTitle.textContent=l.title;let html=l.content_html||'';if(l.lesson_type==='video'&&l.video_url)html=`<div class="video-wrap"><iframe src="${AEPortal.escape(l.video_url)}" allowfullscreen></iframe></div>`+html;if(l.resource_url)html+=`<p><a class="btn btn-ghost" href="${AEPortal.escape(l.resource_url)}" target="_blank">Download Resource</a></p>`;lessonContent.innerHTML=html||'<p>No lesson content has been added yet.</p>';prevBtn.disabled=idx===0;completeBtn.textContent=progress.has(l.id)?(idx===lessons.length-1?'Completed':'Continue'):'Mark Complete & Continue';}
async function mark(){const l=lessons[idx];if(!progress.has(l.id)){const {error}=await c.from('lesson_progress').upsert({user_id:session.user.id,course_id:course.id,lesson_id:l.id,completed:true,completed_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id,lesson_id'});if(error)return alert(error.message);progress.add(l.id);renderNav();updateProgress();}if(idx<lessons.length-1)show(idx+1);}
function updateProgress(){const pct=lessons.length?Math.round(progress.size/lessons.length*100):0;progressBar.style.width=pct+'%';progressText.textContent=pct+'% complete';}
prevBtn.onclick=()=>show(idx-1);completeBtn.onclick=mark;boot();
</script><script src="assets/js/site-shell.js?v=mobile-hero-image-first-20261107v5"></script><script src="assets/js/main.js?v=forms-fixed-20261107m"></script></body></html>
