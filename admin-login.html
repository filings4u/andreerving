<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Andre Erving</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.auth-wrap{min-height:78vh;display:grid;place-items:center;padding:60px 20px;background:linear-gradient(180deg,#f7f9fc,#fff)}
.auth-card{width:min(540px,100%);background:#fff;border:1px solid #dfe5ec;border-radius:22px;padding:34px;box-shadow:0 20px 50px rgba(11,31,58,.1)}
.auth-card label{display:block;font-weight:700;margin:18px 0 7px}.auth-card input{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:10px;font:inherit}.auth-card .btn{width:100%;margin-top:22px}.auth-links{display:flex;justify-content:space-between;gap:14px;margin-top:16px;flex-wrap:wrap}.auth-links button{border:0;background:none;color:#174c9a;font-weight:700;cursor:pointer;padding:0}.notice{margin-top:18px;padding:12px 14px;border-radius:10px;background:#f5f7fa;line-height:1.5}.notice:empty{display:none}.muted{color:#64748b;font-size:.94rem}.hidden{display:none}
</style>
</head>
<body>
<main class="auth-wrap">
<section class="auth-card">
<span class="eyebrow">Management</span>
<h1 id="heading">Admin sign in.</h1>
<p class="muted" id="subheading">Access the Andre Erving management workspace.</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="email" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required>
<label id="confirmLabel" class="hidden">Confirm Password</label><input id="confirmPassword" class="hidden" type="password" autocomplete="new-password" minlength="8">
<button id="submitBtn" class="btn btn-primary">Sign In</button>
</form>
<div class="auth-links">
<button type="button" id="activateBtn">First time? Activate admin account</button>
<button type="button" id="resetBtn">Forgot password?</button>
</div>
<p id="msg" class="notice"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
const c=AE();
const allowedBootstrap='support@andreerving.com';
let mode='login';
const $=id=>document.getElementById(id);
function setMsg(text){$('msg').textContent=text||'';}
function setMode(next){
  mode=next;setMsg('');
  const activate=next==='activate';
  $('heading').textContent=activate?'Activate super admin account.':'Admin sign in.';
  $('subheading').textContent=activate?'Create the password for support@andreerving.com. A confirmation email may be required before first sign in.':'Access the Andre Erving management workspace.';
  $('submitBtn').textContent=activate?'Create Super Admin Account':'Sign In';
  $('confirmLabel').classList.toggle('hidden',!activate);$('confirmPassword').classList.toggle('hidden',!activate);$('confirmPassword').required=activate;
  $('activateBtn').textContent=activate?'Back to sign in':'First time? Activate admin account';
  if(activate){$('email').value=allowedBootstrap;$('email').readOnly=true;$('password').autocomplete='new-password';}else{$('email').readOnly=false;$('password').autocomplete='current-password';}
}
$('activateBtn').onclick=()=>setMode(mode==='activate'?'login':'activate');
$('resetBtn').onclick=async()=>{
  const e=$('email').value.trim(); if(!e){setMsg('Enter your admin email first.');return;}
  const {error}=await c.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname.replace('admin-login.html','admin-login.html')});
  setMsg(error?error.message:'Password reset email sent.');
};
$('loginForm').onsubmit=async ev=>{
  ev.preventDefault();setMsg('');
  const e=$('email').value.trim().toLowerCase(), p=$('password').value;
  if(mode==='activate'){
    if(e!==allowedBootstrap){setMsg('This activation is reserved for support@andreerving.com.');return;}
    if(p!==$('confirmPassword').value){setMsg('Passwords do not match.');return;}
    const {data,error}=await c.auth.signUp({email:e,password:p,options:{data:{full_name:'Andre Erving Support'}}});
    if(error){setMsg(error.message);return;}
    if(data.session){location.href='admin-portal.html';return;}
    setMsg('Super admin account created. Check support@andreerving.com for the confirmation email, then sign in.');
    setMode('login');$('email').value=e;
    return;
  }
  const {data,error}=await c.auth.signInWithPassword({email:e,password:p});
  if(error){setMsg(error.message);return;}
  const {data:a}=await c.from('admin_profiles').select('id,role,active').eq('id',data.user.id).eq('active',true).maybeSingle();
  if(!a){await c.auth.signOut();setMsg('This account does not have admin access.');return;}
  location.href='admin-portal.html';
};
</script>
</body>
</html>
