<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login — Andre Erving</title><link rel="stylesheet" href="assets/css/style.css"><style>.auth-wrap{min-height:75vh;display:grid;place-items:center;padding:60px 20px}.auth-card{width:min(520px,100%);background:#fff;border:1px solid #dfe5ec;border-radius:22px;padding:34px;box-shadow:0 20px 50px rgba(11,31,58,.1)}.auth-card label{display:block;font-weight:700;margin:18px 0 7px}.auth-card input{width:100%;padding:14px;border:1px solid #ccd5df;border-radius:10px}.auth-card .btn{width:100%;margin-top:22px}.muted{color:#667085}</style></head><body><header class="site-header"><div class="top-strip"><div class="container"><span>Andre Erving Customer Portal</span><a href="index.html">← Back to website</a></div></div><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-copy"><strong>ANDRE ERVING</strong><span>Customer Portal</span></span></a></div></header><main class="auth-wrap"><section class="auth-card"><span class="eyebrow">Customer access</span><h1>Sign in to your account.</h1><p class="muted">View orders, documents, purchased courses, and course progress.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn btn-primary" type="submit">Sign In</button></form><div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-ghost" type="button" id="createAccount">Create Account</button><button class="btn btn-ghost" type="button" id="forgot">Forgot Password</button></div><p id="msg" class="muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/portal-common.js"></script><script>const c=AE();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const {error}=await c.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return;}location.href='customer-dashboard.html';});createAccount.onclick=async()=>{const e=email.value.trim();if(!e){msg.textContent='Enter your email first.';return;}const pw=prompt('Create a password with at least 8 characters');if(!pw)return;const name=prompt('Your full name')||'';const {error}=await c.auth.signUp({email:e,password:pw,options:{data:{full_name:name}}});msg.textContent=error?error.message:'Account created. Check your email if confirmation is required, then sign in.';};forgot.onclick=async()=>{const e=email.value.trim();if(!e){msg.textContent='Enter your email first.';return;}const {error}=await c.auth.resetPasswordForEmail(e,{redirectTo:location.origin+'/customer-login.html'});msg.textContent=error?error.message:'Password reset email sent.';};</script></body></html>
