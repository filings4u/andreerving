<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f3a"><meta name="robots" content="index,follow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="assets/css/style.css?v=site-fix-20261107b"><title>Online Course | Andre Erving</title><meta name="description" content="Explore self-paced training courses from Andre Erving."><style>.ae-detail{max-width:1100px;margin:auto;padding:42px 20px 90px}.ae-detail-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.8fr);gap:40px;align-items:start}.ae-detail h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.15;margin:15px 0}.ae-detail p{line-height:1.8}.ae-detail-panel{border:1px solid #dce4eb;border-radius:12px;background:#fff;padding:25px;box-shadow:0 12px 40px rgba(8,27,55,.06)}.ae-detail-panel img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px}.ae-detail-panel .price{font-size:2rem;font-weight:750;margin:22px 0 8px;color:#0b1f3a}.ae-detail-facts{padding:0;list-style:none}.ae-detail-facts li{padding:9px 0;border-bottom:1px solid #e7edf2}.ae-detail-panel .btn{width:100%;text-align:center;display:block;margin-top:20px}.ae-detail .eyebrow{color:#8d6b27}@media(max-width:760px){.ae-detail-grid{grid-template-columns:1fr}.ae-detail{padding:24px 16px 60px}}</style></head><body><header class="site-header"></header><main><section class="ae-detail"><nav class="ae-breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="courses.html">Courses</a><span>/</span><span id="crumb">Course</span></nav><div class="ae-detail-grid"><div><span class="eyebrow">ONLINE SELF-PACED TRAINING</span><h1 id="course-title">Loading course…</h1><p id="course-description">Checking the published course catalog.</p><p id="course-message" role="status"></p><p><a href="courses.html">← Explore all courses</a></p></div><aside class="ae-detail-panel" id="course-panel" hidden><img id="course-image" alt=""><div class="price" id="course-price"></div><ul class="ae-detail-facts" id="course-facts"></ul><a class="btn btn-primary" id="course-enroll" href="#" hidden>Enroll now</a><p id="course-unavailable" hidden>Enrollment is not available for this course yet.</p></aside></div></section></main><footer class="site-footer"></footer><script src="assets/js/site-shell.js?v=mobile-hero-image-first-20261107v5"></script><script>(async()=>{const slug=new URLSearchParams(location.search).get("slug")||"";const title=document.getElementById("course-title"),description=document.getElementById("course-description"),message=document.getElementById("course-message");if(!/^[a-z0-9-]{1,100}$/.test(slug)){title.textContent="Course not found";description.textContent="Please choose a course from the catalog.";message.textContent="";return}try{const response=await fetch("https://gnfyidajbectlppsekzj.supabase.co/functions/v1/andre-public-course-access",{headers:{Accept:"application/json"},cache:"no-store"});if(!response.ok)throw Error("Unable to load published courses");const payload=await response.json();const c=Array.isArray(payload.courses)?payload.courses.find(x=>x.slug===slug):null;if(!c){title.textContent="Course not available";description.textContent="This course is not currently published. Browse the available courses instead.";message.textContent="";document.querySelector('meta[name="robots"]').content="noindex,follow";return}title.textContent=c.title;document.getElementById("crumb").textContent=c.title;description.textContent=c.description||"Explore this self-paced online program.";document.title=c.title+" | Andre Erving";document.querySelector('meta[name="description"]').content=(c.description||c.title).slice(0,160);const box=document.getElementById("course-panel");box.hidden=false;const img=document.getElementById("course-image");img.src=c.featured_image_url||({"trucking-pro":"assets/images/course-trucking.webp","freight-broker-training":"assets/images/course-broker.webp","dispatcher-training":"assets/images/course-dispatch.webp","time-management":"assets/images/course-time.webp"}[slug]||"assets/images/courses-classroom.webp");img.alt=c.title;document.getElementById("course-price").textContent=c.enrollable?new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(c.price):"Enrollment unavailable";const facts=document.getElementById("course-facts");facts.replaceChildren();for(const line of [c.category||"Online course",c.access_days?c.access_days+"-day access":"Lifetime access",c.certificate_enabled?"Certificate included":"Self-paced learning"]){const li=document.createElement("li");li.textContent=line;facts.append(li)}const btn=document.getElementById("course-enroll");if(c.enrollable){btn.href="checkout.html?"+new URLSearchParams({item:slug,price_key:"offering."+slug,source:"course.html"}).toString();btn.hidden=false}else document.getElementById("course-unavailable").hidden=false;message.textContent=""}catch(error){title.textContent="Course catalog unavailable";description.textContent="Please return to the course catalog and try again.";message.textContent=error.message}})();</script></body></html>
