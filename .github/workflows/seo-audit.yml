name: SEO integrity audit
on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "blog-sitemap.xml"
      - "robots.txt"
      - "scripts/audit_seo.py"
      - ".github/workflows/seo-audit.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public SEO, sitemap, responsive markup, and image assets
        run: python scripts/audit_seo.py
