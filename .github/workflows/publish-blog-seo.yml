name: Publish indexable blog pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_blog.py'
      - 'requirements-blog.txt'
      - '.github/workflows/publish-blog-seo.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: publish-blog-seo
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-blog.txt
      - name: Install safe HTML renderer
        run: pip install -r requirements-blog.txt
      - name: Generate published articles and sitemap
        run: python scripts/sync_blog.py
      - name: Commit published static articles
        run: |
          git config user.name "andre-blog-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add blog/ blog-sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Sync published blog pages from Supabase"
            git push
          fi
